<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#F3F5FA}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}

/* polish: tables keep cells on one line and scroll inside their card */
td,th{white-space:nowrap}
[style*="overflow-x: auto"]{position:relative}
[style*="border-radius: 999px"]{white-space:nowrap}
/* polish: status pills carry a shape, not only a colour */
[style*="--tone: up"]::before{content:"\2713";font-weight:800;margin-right:5px;font-size:11px}
[style*="--tone: warn"]::before{content:"!";font-weight:800;margin-right:5px;font-size:12px}
[style*="--tone: danger"]::before{content:"\2715";font-weight:800;margin-right:5px;font-size:10px}
</style>
</head><body>

<div style="position: relative; min-height: 100vh; height: auto; overflow: visible; background: #F3F5FA; color: #0E1424; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">


<div style="background: linear-gradient(140deg, #4C6BFF 0%, #2E46D6 100%); color: #FFFFFF; padding: 44px 24px 64px; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; color: #2E46D6; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">S</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Sellora Driver</h1>
<span style="font-size: 14px; color: rgba(255,255,255,0.85)">Delivering for Ada's Fashion</span>
</div>
</div>






<main style="position: relative; flex: 1 0 auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; margin-top: -48px">






<section style="background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 8px 24px rgba(16,24,40,0.06); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; color: #0E1424">

<div style="display: flex; flex-direction: column; gap: 4px">

<h2 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3">Sign in</h2>
<span style="color: #596276; line-height: 1.5; font-size: 14px">Use your phone number and 6-digit PIN.</span>
</div>




















<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Phone number</span>
<span style="display: flex; align-items: center; gap: 10px; height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #7E879A; background: #F2F4F9; box-shadow: none">
<span style="font-weight: 600; color: #596276; padding-right: 10px; border-right: 1px solid #C9CFDC">+234</span>
<input type="tel" inputMode="tel" value="803 000 1122" placeholder="" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; color: #0E1424; font: inherit; font-size: 16px; font-weight: 500">
</span>
</label>



































<fieldset style="border: none; margin: 0; padding: 0; min-width: 0">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">PIN</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 1" value="•" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: none"><input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 2" value="•" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: none"><input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 3" value="•" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: none"><input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 4" value="•" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: none"><input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 5" value="" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: inset 0 0 0 2px #3B5BFD"><input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 6" value="" style="height: 56px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: 1px solid #7E879A; font: inherit; font-size: 22px; font-weight: 700; background: #F2F4F9; color: #0E1424; box-shadow: none">
</div>
</fieldset>







































<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #E9EDFF; color: #3B5BFD; line-height: 1.45; font-size: 14px; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path></svg>
<span>Forgot your PIN? Ask the shop for a new setup code.</span>
</div>







</section>

</main>


<div style="position: sticky; bottom: 0; z-index: 5; padding: 12px 16px 20px; background: #FFFFFF; box-shadow: 0 -1px 0 #E8EBF2; display: flex; flex-direction: column; gap: 8px">
<a href="DriverDeliveries.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; font-weight: 700; font-size: 16px; flex: none; background: #3B5BFD; color: #FFFFFF">Sign in</a><a href="DriverSetPin.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; font-weight: 700; font-size: 16px; flex: none; height: 44px; background: transparent; color: #3B5BFD; font-size: 14px">First time? Set up with a code</a><a href="DriverPinLocked.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; font-weight: 700; font-size: 16px; flex: none; height: 44px; background: transparent; color: #3B5BFD; font-size: 14px">Locked out?</a>
</div>





</div>
</body></html>
