<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#FFFFFF}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}

/* polish: tables keep cells on one line and scroll inside their card */
td,th{white-space:nowrap}
[style*="overflow-x: auto"]{position:relative}
[style*="border-radius: 999px"]{white-space:nowrap}
/* polish: status pills carry a shape, not only a colour */
[style*="--tone: up"]::before{content:"\2713";font-weight:800;margin-right:5px;font-size:11px}
[style*="--tone: warn"]::before{content:"!";font-weight:800;margin-right:5px;font-size:12px}
[style*="--tone: danger"]::before{content:"\2715";font-weight:800;margin-right:5px;font-size:10px}
</style>
</head><body>

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #0E1424; font-family: Inter, system-ui, sans-serif; font-size: 14px">

<main style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; padding: 20px 20px 28px; box-sizing: border-box; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #3B5BFD; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px">S</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; flex: 1 1 auto">Sellora</span>

</div>

<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px">












<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: #E9EDFF; color: #3B5BFD; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10M9 12l2 2 4-4"></path></svg>
</span>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Set up two-factor sign-in</h1>
<span style="color: #596276; line-height: 1.5">Ada's Fashion asks every staff member to use an authenticator app.</span>
</div>







<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 16px; border-radius: 16px; background: #F2F4F9">
<svg role="img" aria-label="QR code for your authenticator app" width="132" height="132" viewBox="0 0 21 21" style="background: #FFFFFF; border-radius: 10px; padding: 8px; flex: 0 0 auto" shape-rendering="crispEdges">
<path fill="#0E1424" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v1H8zM10 0h2v1h-2zM9 2h2v1H9zM8 4h1v2H8zM11 3h1v3h-1zM8 8h2v1H8zM11 8h3v1h-3zM0 8h2v1H0zM3 8h3v1H3zM2 10h2v1H2zM5 10h3v1H5zM0 12h1v1H0zM9 10h1v3H9zM12 10h2v2h-2zM15 8h1v2h-1zM17 8h4v1h-4zM16 10h3v1h-3zM20 10h1v3h-1zM14 12h2v1h-2zM17 12h2v2h-2zM8 14h3v1H8zM12 14h1v3h-1zM9 16h2v2H9zM14 15h2v1h-2zM17 15h1v3h-1zM19 16h2v1h-2zM14 17h2v3h-2zM8 19h3v2H8zM12 19h1v2h-1zM16 19h1v1h-1zM18 19h3v2h-3z"></path>
</svg>
<span style="display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 160px">
<span style="font-size: 13px; font-weight: 600">Or type this key</span>
<span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: .08em; overflow-wrap: anywhere">JBSW Y3DP EHPK 3PXP</span>
<span style="color: #596276; font-size: 12px">Google Authenticator, 1Password, Authy or any TOTP app.</span>
</span>
</div>









<fieldset style="border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 10px">Code from the app</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 1" value="0" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: none">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 2" value="4" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: none">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 3" value="8" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: none">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 4" value="2" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: none">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 5" value="" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: inset 0 0 0 2px #3B5BFD">

<input type="text" inputMode="numeric" maxLength="1" aria-label="Digit 6" value="" style="height: 52px; width: 100%; box-sizing: border-box; text-align: center; border-radius: 12px; border: none; outline: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: #0E1424; background: #F2F4F9; box-shadow: none">

</div>
</fieldset>
