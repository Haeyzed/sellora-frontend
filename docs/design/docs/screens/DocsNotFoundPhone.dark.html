<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#07090F}</style>

<style>
body{margin:0}
a{color:inherit}
td,th{white-space:nowrap}
[style*="border-radius: 999px"]{white-space:nowrap}
[style*="--tone: up"]::before{content:"\2713";font-weight:800;margin-right:5px;font-size:11px}
[style*="--tone: warn"]::before{content:"!";font-weight:800;margin-right:5px;font-size:12px}
[style*="--tone: danger"]::before{content:"\2715";font-weight:800;margin-right:5px;font-size:10px}
[role="dialog"] > *,nav[aria-label="Docs"] > *{flex-shrink:0}
mark{background:transparent;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
</style>

<button type="button" aria-label="Open the docs menu" style="width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: none; background: #1A1E2A; color: #F2F4F8; cursor: pointer; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: #6B86FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700">S</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-size: 19px">Sellora <span style="color: #9AA3B5; font-weight: 500">Docs</span></span>
</a>


<span style="flex: 1 1 auto"></span>
<button type="button" aria-label="Search the docs" style="width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: none; background: #1A1E2A; color: #F2F4F8; cursor: pointer; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.35-4.35"></path></svg></button>

</div>
</header>








<main style="box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: 64px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 96px; line-height: 1; font-weight: 700; background: linear-gradient(150deg, #2B3A8F 0%, #1B2246 65%, #121833 100%); -webkit-background-clip: text; background-clip: text; color: transparent">404</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 600">This page moved or never existed</h1>
<p style="margin: 0; color: #9AA3B5">Docs pages get renamed as Sellora grows. Search for what you need, or start from the help centre.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px"><a href="#" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 12px; background: #6B86FF; color: #FFFFFF; text-decoration: none; font-weight: 600">Go to the help centre</a><a href="#" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 12px; background: #1A1E2A; color: #F2F4F8; text-decoration: none; font-weight: 600">Search the docs</a></div>
