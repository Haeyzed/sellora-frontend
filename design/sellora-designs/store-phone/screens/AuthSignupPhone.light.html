<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#FFFFFF}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}

/* polish: tables keep cells on one line and scroll inside their card */
td,th{white-space:nowrap}
[style*="overflow-x: auto"]{position:relative}
[style*="border-radius: 999px"]{white-space:nowrap}
/* polish: status pills carry a shape, not only a colour */
[style*="--tone: up"]::before{content:"\2713";font-weight:800;margin-right:5px;font-size:11px}
[style*="--tone: warn"]::before{content:"!";font-weight:800;margin-right:5px;font-size:12px}
[style*="--tone: danger"]::before{content:"\2715";font-weight:800;margin-right:5px;font-size:10px}
</style>
</head><body>

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #0E1424; font-family: Inter, system-ui, sans-serif; font-size: 14px">

<main style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; padding: 20px 20px 28px; box-sizing: border-box; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #3B5BFD; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px">S</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; flex: 1 1 auto">Sellora</span>

</div>

<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px">






<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Create your store</h1>
<span style="color: #596276">Free to start. You can change these later.</span>
</div>

<form style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Store name</span>
<input type="text" value="Ada's Fashion" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Store address</span>
<span style="box-sizing: border-box; border: 1px solid #7E879A; display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 12px; background: #F2F4F9">
<input type="text" value="ada-fashion" style="border: none; outline: none; background: transparent; color: #0E1424; font: inherit; flex: 1 1 auto; min-width: 0">
<span style="color: #596276">.sellora.com</span>
</span>
<span style="display: flex; align-items: center; gap: 6px; color: #0B6B40; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
Available
</span>
</label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Country</span>
<select style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none"><option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option><option>United Kingdom</option><option>United States</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Where your data is kept</span>
<select style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none"><option>Africa</option><option>Europe</option><option>United States</option></select>
</label>
</div>

<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F2F4F9; color: #596276; font-size: 13px; line-height: 1.5">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 2px"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg>
<span>Starts in NGN, English, Africa/Lagos time, prices include tax. You can change these later. The region is fixed once the store is created.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Your name</span>
<input type="text" value="Ada Okafor" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Email</span>
<input type="email" value="ada@adafashion.ng" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none">
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Password</span>
<input type="password" value="correct horse battery staple" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none">
<span aria-label="Password strength: strong" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span style="height: 4px; border-radius: 2px; background: #0B6B40"></span>
<span style="height: 4px; border-radius: 2px; background: #0B6B40"></span>
<span style="height: 4px; border-radius: 2px; background: #0B6B40"></span>
<span style="height: 4px; border-radius: 2px; background: #F2F4F9"></span>
</span>
<span style="color: #596276; font-size: 12px">At least 12 characters. Longer is stronger.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Confirm password</span>
<input type="password" value="correct horse battery staple" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid #7E879A; background: #F2F4F9; color: #0E1424; font: inherit; outline: none">
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; color: #596276; line-height: 1.5">
<input type="checkbox" checked style="width: 18px; height: 18px; margin-top: 1px; accent-color: #3B5BFD">
<span>I agree to the <a href="AuthLegalTermsPhone.dc.html" style="color: #3B5BFD; font-weight: 600">Terms of service 2.1</a> and <a href="AuthLegalPrivacyPhone.dc.html" style="color: #3B5BFD; font-weight: 600">Privacy policy 2.2</a>.</span>
</label>
<a href="AuthVerifyPhone.dc.html" style="height: 50px; border-radius: 12px; background: #3B5BFD; color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center">Create store</a>
</form>
<span style="color: #596276; text-align: center">Already have a store? <a href="AuthSigninPhone.dc.html" style="color: #3B5BFD; font-weight: 600">Sign in</a></span>







</div>
</div>
<span style="color: #596276; font-size: 12px">© Sellora · <a href="#">Terms</a> · <a href="#">Privacy</a></span>
</main>


</div>
</body></html>
